Inserts a canonical root <code>:meta</code> header into an enclosed STVN document.
The header includes <code>#name</code>, <code>#domain</code> (defaulting to <code>"domain"</code> if omitted in the filename stem), and <code>#kind</code>
facets conforming to STVN Specification &sect; 1.1 and &sect; 3.10.
