        stroke="#C99E5C" 
        stroke-width="1.2" 
        stroke-linejoin="round"/>
  
  <!-- Interior isometric creases -->
  <path d="M8 1.5V14.5M2 4.8L8 8.1L14 4.8" 
        stroke="#C99E5C" 
        stroke-width="1.2" 
        stroke-linejoin="round" 
